name: Make clips

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Twitch VOD link (e.g. https://www.twitch.tv/videos/1234567890)"
        required: true
      preset:
        description: "Streamer preset name from presets/streamers.json (optional)"
        required: false
        default: ""
      profile:
        description: "Content type (ignored if preset sets it)"
        type: choice
        options: [funny, irl, gaming, gta6]
        default: funny
      layout:
        description: "Vertical layout (ignored if preset sets it)"
        type: choice
        options: [full, center, facecam]
        default: full
      max_clips:
        description: "How many clips"
        default: "12"

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Make clips
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          URL: ${{ inputs.url }}
          PRESET: ${{ inputs.preset }}
          PROFILE: ${{ inputs.profile }}
          LAYOUT: ${{ inputs.layout }}
          MAX_CLIPS: ${{ inputs.max_clips }}
        run: |
          ARGS=(--max-clips "$MAX_CLIPS")
          if [ -n "$PRESET" ]; then ARGS+=(--preset "$PRESET"); else ARGS+=(--profile "$PROFILE" --layout "$LAYOUT"); fi
          python -m clipper "$URL" "${ARGS[@]}"
          cat output/*/POST-THESE.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clips-${{ github.run_number }}
          path: |
            output/*/*.mp4
            output/*/POST-THESE.md
            output/*/clips.json
          retention-days: 30
          if-no-files-found: warn
